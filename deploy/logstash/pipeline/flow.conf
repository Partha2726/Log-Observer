# Log Observer ingestion pipeline (spec sections 6.2 and 6.4).
#
# Filebeat sends one event per log line (one per multi-line event for format D) with
# log_format, service.name, log.file.path and log.offset. This pipeline parses the four
# formats into ECS field names, extracts IDs and business fields, masks counterparty
# accounts, and writes to logs-flow-yyyy.MM.dd with a file-position fingerprint as _id.
# Lines that fail to parse are kept with their raw text and a failure tag; nothing is dropped.
#
# Flow definitions (config/flows/*.yaml, mounted read-only at /usr/share/logstash/flows) supply
# the flowRef patterns and business field names, so no demo stage, service or event name is
# hard-coded here. Format D event prefixes live in ../patterns/flow.
#
# scripts/test-pipeline.sh runs the filter section below (between the BEGIN/END markers)
# against the fixtures in ../test.

input {
  beats {
    port => 5044
  }
}

# BEGIN FILTER
filter {
  # ---------------------------------------------------------------- 0. Shipper metadata
  # Keep log_format, service.name, log.file.path and log.offset; drop the shipper's own fields
  # (its host.name is the Filebeat container, not the host that wrote the line).
  mutate {
    remove_field => ["[host]", "[agent]", "[ecs]", "[input]", "[event]", "[log][flags]", "[tags]"]
  }

  # Service from the folder (data/logs/<service>/...); an unknown folder is tagged and kept (PARSE-004).
  ruby {
    code => '
      path = event.get("[log][file][path]").to_s
      folder = path.split("/")[-2]
      known = { "gateway" => "A", "workflow-service" => "B", "auth-service" => "C", "billing-service" => "D" }
      if known.key?(folder)
        event.set("[service][name]", folder) if event.get("[service][name]").nil?
        event.set("log_format", known[folder]) if event.get("log_format").nil?
      else
        event.tag("_serviceunknown")
      end
    '
  }

  # ---------------------------------------------------------------- 1. Parse by format
  if [log_format] == "A" {
    grok {
      match => { "message" => '^%{IPORHOST:[client][ip]} %{NOTSPACE:[@metadata][ident]} %{NOTSPACE:[user][id]} \[%{HTTPDATE:[@metadata][ts]}\] "%{WORD:[http][request][method]} %{NOTSPACE:[url][original]} HTTP/%{NUMBER:[http][version]}" %{INT:[http][response][status_code]} (?:%{INT:[http][response][bytes]}|-)(?: "%{DATA:[http][request][referrer]}" "%{DATA:[user_agent][original]}")?(?: rid=%{NOTSPACE:[http][request][id]})?(?: rt=%{NUMBER:[event][duration_s]})?(?: tid=(?:(?<[trace][id]>[0-9a-f]{32})|-))?$' }
    }
    if "_grokparsefailure" not in [tags] {
      grok {
        patterns_dir => ["/usr/share/logstash/patterns"]
        match => { "[log][file][path]" => "%{FLOW_HOST_IN_FILE}" }
        tag_on_failure => []
      }
      date {
        match => ["[@metadata][ts]", "dd/MMM/yyyy:HH:mm:ss Z"]
        locale => "en"
      }
      if [user][id] == "-" { mutate { remove_field => ["[user][id]"] } }
      if [http][request][referrer] == "-" { mutate { remove_field => ["[http][request][referrer]"] } }
      mutate {
        convert => {
          "[http][response][status_code]" => "integer"
          "[http][response][bytes]" => "integer"
          "[event][duration_s]" => "float"
        }
        copy => { "message" => "message_body" }
      }
      ruby {
        code => '
          url = event.get("[url][original]").to_s
          event.set("[url][path]", url.split("?", 2)[0])
          status = event.get("[http][response][status_code]").to_i
          level = status >= 500 ? "ERROR" : (status >= 400 ? "WARN" : "INFO")
          event.set("[log][level]", level)
        '
      }
    }
  } else if [log_format] == "B" {
    json {
      source => "message"
      target => "[@metadata][j]"
      skip_on_invalid_json => false
    }
    if "_jsonparsefailure" not in [tags] {
      # The JSON keys are flat ECS names ("log.level", "user.id"); nest them. The flow definitions'
      # business fields and "reason" go under flow.* in step 4.
      ruby {
        code => '
          j = event.get("[@metadata][j]") || {}
          j.each do |key, value|
            next if value.nil?
            case key
            when "@timestamp" then event.set("[@metadata][ts]", value)
            when "message" then event.set("message_body", value)
            when "flow.ref" then event.set("[@metadata][flow_ref]", value)
            else
              if key.include?(".")
                event.set("[" + key.split(".").join("][") + "]", value)
              end
            end
          end
        '
      }
      date {
        match => ["[@metadata][ts]", "ISO8601"]
      }
    }
  } else if [log_format] == "C" {
    grok {
      match => { "message" => '^<%{NONNEGINT:[@metadata][pri]}>1 %{TIMESTAMP_ISO8601:[@metadata][ts]} %{NOTSPACE:[host][name]} %{NOTSPACE:[@metadata][app]} %{NOTSPACE:[process][pid]} %{NOTSPACE:[event][action]} (?:-|\[%{DATA:[@metadata][sd_id]} %{DATA:[@metadata][sd]}\]) %{GREEDYDATA:message_body}' }
    }
    if "_grokparsefailure" not in [tags] {
      date {
        match => ["[@metadata][ts]", "ISO8601"]
      }
      if [@metadata][sd] {
        kv {
          source => "[@metadata][sd]"
          target => "[@metadata][sdk]"
          field_split => " "
          value_split => "="
          trim_value => "\""
        }
      }
      ruby {
        code => '
          sd = event.get("[@metadata][sdk]") || {}
          map = {
            "user" => "[user][id]", "session" => "[session][id]", "rid" => "[http][request][id]",
            "ip" => "[client][ip]", "perm" => "[flow][permission]", "resource" => "[flow][resource]",
            "reason" => "[flow][reason]", "mfa" => "[flow][mfa]", "idleMinutes" => "[flow][idle_minutes]",
            "trace" => "[trace][id]", "span" => "[span][id]"
          }
          sd.each do |key, value|
            next if value.nil? || value == "-"
            target = map[key]
            event.set(target, value) if target
          end
          ["[event][action]", "[process][pid]", "[host][name]"].each do |f|
            event.remove(f) if event.get(f) == "-"
          end
          sev = event.get("[@metadata][pri]").to_i % 8
          event.set("[log][level]", sev <= 3 ? "ERROR" : (sev == 4 ? "WARN" : "INFO"))
        '
      }
      mutate { convert => { "[process][pid]" => "integer" } }
    }
  } else if [log_format] == "D" {
    grok {
      match => { "message" => '(?m)^%{TIMESTAMP_ISO8601:[@metadata][ts]} \| %{LOGLEVEL:[log][level]}\s*\| \[%{DATA:[process][thread][name]}\] \| (?:%{UUID:[http][request][id]})?(?: trace_id=(?<[trace][id]>[0-9a-f]{32})?)?\s*\| %{DATA:[log][logger]}:%{DATA:method}\(%{INT:line}\) \| %{GREEDYDATA:message_body}' }
    }
    if "_grokparsefailure" not in [tags] {
      grok {
        patterns_dir => ["/usr/share/logstash/patterns"]
        match => { "[log][file][path]" => "%{FLOW_HOST_IN_FILE}" }
        tag_on_failure => []
      }
      # Format D carries no zone: its lines are local time of the billing hosts (LOG_TIMEZONE).
      date {
        match => ["[@metadata][ts]", "yyyy-MM-dd HH:mm:ss,SSS"]
        timezone => "${LOG_TIMEZONE:UTC}"
      }
      mutate { convert => { "line" => "integer" } }
      # event.action from the message prefixes in patterns/flow.
      grok {
        patterns_dir => ["/usr/share/logstash/patterns"]
        match => { "message_body" => "^%{FLOW_D_EVENT}" }
        tag_on_failure => []
      }
      ruby {
        code => '
          actions = event.get("[@metadata][d_action]")
          if actions.is_a?(Hash)
            hit = actions.find { |_, v| !v.nil? }
            event.set("[event][action]", hit[0]) if hit
          end
        '
      }
    }
  }

  # ---------------------------------------------------------------- 2. Levels, IDs and business fields
  ruby {
    init => '
      require "yaml"
      require "time"
      @ref_patterns = []
      @business = {}
      dir = ENV["FLOW_DEFINITIONS_DIR"] || "/usr/share/logstash/flows"
      Dir.glob(File.join(dir, "*.{yaml,yml}")).sort.each do |file|
        doc = YAML.safe_load(File.read(file))
        next unless doc.is_a?(Hash) && doc["refPattern"].is_a?(String)
        body = doc["refPattern"].sub(/\A\^/, "").sub(/\$\z/, "")
        @ref_patterns << Regexp.new("\\b(?:" + body + ")\\b")
        (doc["businessFields"] || {}).each { |name, source| @business[name] ||= source }
      end
      raise "No flow definitions with a refPattern in #{dir}" if @ref_patterns.empty?
      @user_pattern = Regexp.new(ENV["USER_ID_PATTERN"] || "\\busr-\\d{4}\\b")
      @correlation = /externalCorrelationId=([\w-]+)/
      @exception = /(?:[a-zA-Z_$][\w$]*\.)+\w*(?:Exception|Error)\b/
      @provider_status = /status=(\d{3})/
      @d_amount = /amount=(\d+\.\d{2})/
      @d_limit = /limit=(\d+\.\d{2})/
      @d_currency = /\d+\.\d{2} ([A-Z]{3})\b/
    '
    code => '
      format = event.get("log_format")
      failed = (event.get("tags") || []).any? { |t| t.end_with?("parsefailure") }
      body = event.get("message_body").to_s
      # Where flowRefs are searched: the URL (A), the raw JSON line (B), the message (C, D),
      # or the raw line when parsing failed (F-05).
      text = if failed
               event.get("message").to_s
             elsif format == "A"
               event.get("[url][original]").to_s
             elsif format == "B"
               event.get("message").to_s
             else
               body
             end
      refs = []
      own = event.get("[@metadata][flow_ref]")
      refs << own if own
      @ref_patterns.each { |p| text.scan(p) { refs << $~[0] } }
      refs.uniq!
      event.set("[flow][refs]", refs) unless refs.empty?

      if format == "A" && !failed
        method = event.get("[http][request][method]")
        path = event.get("[url][path]").to_s
        @ref_patterns.each { |p| path = path.gsub(p, "{ref}") }
        event.set("[event][action]", "#{method} #{path}")
      end

      if format == "D" && !failed
        if event.get("[user][id]").nil? && (m = body.match(@user_pattern))
          event.set("[user][id]", m[0])
        end
        if (m = body.match(@exception))
          event.set("[error][type]", m[0])
        end
        if (m = body.match(@provider_status))
          event.set("[flow][provider_status]", m[1])
        end
        if (m = body.match(@d_amount)) then event.set("[flow][amount]", m[1].to_f) end
        if (m = body.match(@d_limit)) then event.set("[flow][limit_amount]", m[1].to_f) end
        if (m = body.match(@d_currency)) then event.set("[flow][currency]", m[1]) end
      end
      corr = []
      body.scan(@correlation) { corr << $~[1] }
      corr.uniq!
      event.set("[flow][external_correlation_id]", corr.length == 1 ? corr[0] : corr) unless corr.empty?

      if format == "B" && !failed
        j = event.get("[@metadata][j]") || {}
        amount_key = @business["amount"]
        currency_key = @business["currency"]
        counterparty_key = @business["counterparty"]
        event.set("[flow][amount]", j[amount_key].to_f) if amount_key && !j[amount_key].nil?
        event.set("[flow][currency]", j[currency_key]) if currency_key && j[currency_key]
        event.set("[flow][reason]", j["reason"]) if j["reason"]
        event.set("[flow][cost_centre]", j["cost_centre"]) if j["cost_centre"]
        if counterparty_key && j[counterparty_key]
          account = j[counterparty_key].to_s
          event.set("[@metadata][counterparty]", account)
          event.set("[flow][counterparty_last4]", account[-4..] || account)
        end
      end

      # Derived flags (section 6.2 step 6).
      level = event.get("[log][level]")
      level = level.upcase if level
      event.set("[log][level]", level) if level
      status = event.get("[http][response][status_code]").to_i
      gateway = format == "A"
      is_error = %w[ERROR FATAL].include?(level) || !event.get("[error][type]").nil? || (gateway && status >= 500)
      is_warning = level == "WARN" || (gateway && status >= 400 && status < 500)
      event.set("is_error", is_error)
      event.set("is_warning", is_warning)
      event.set("has_stacktrace", body.include?("\n\tat ") || !event.get("[error][stack_trace]").nil?)
      event.set("ingested_at", Time.now.utc.iso8601(3))
    '
  }

  # ---------------------------------------------------------------- 3. Counterparty: keyed hash, then mask
  if [@metadata][counterparty] {
    fingerprint {
      source => "[@metadata][counterparty]"
      target => "[flow][counterparty_hash]"
      method => "SHA256"
      key => "${COUNTERPARTY_HASH_KEY}"
    }
  }
  # Any 9-18 digit account-like number (not part of a UUID or hex ID) becomes ACC-****1234,
  # in the raw message and the message body (section 6.4, NFR-05).
  ruby {
    code => '
      mask = /(?<![\w-])\d{9,18}(?![\w-])/
      ["message", "message_body"].each do |field|
        value = event.get(field)
        next unless value.is_a?(String)
        masked = value.gsub(mask) { |digits| "ACC-****" + digits[-4..] }
        event.set(field, masked) if masked != value
      end
    '
  }

  # ---------------------------------------------------------------- 4. Stable document ID
  # SHA-256 of file path + offset: re-ingesting a file creates no duplicates (PARSE-010).
  fingerprint {
    source => ["[log][file][path]", "[log][offset]"]
    concatenate_sources => true
    target => "[@metadata][doc_id]"
    method => "SHA256"
  }
}
# END FILTER

output {
  elasticsearch {
    hosts => ["${ES_URL:http://elasticsearch:9200}"]
    user => "logstash_writer"
    password => "${LOGSTASH_WRITER_PASSWORD}"
    index => "logs-flow-%{+yyyy.MM.dd}"
    document_id => "%{[@metadata][doc_id]}"
    # create_doc privilege: a replayed line is a 409 duplicate, never a second document.
    action => "create"
    manage_template => false
    ilm_enabled => false
    data_stream => false
  }
}
