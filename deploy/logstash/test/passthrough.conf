# Test pipeline (T07, PARSE-003): writes every event Filebeat sends, unparsed, as JSON lines,
# so the event count and multi-line grouping can be compared with the generator's ground truth.
input {
  beats {
    port => 5044
  }
}

output {
  file {
    path => "/out/events.jsonl"
    codec => json_lines
  }
}
