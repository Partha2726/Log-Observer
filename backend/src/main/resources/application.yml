spring:
  application:
    name: log-observer

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ielop}
    username: ${DB_USERNAME:ielop}
    password: ${DB_PASSWORD:ielop}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations, not Hibernate. Hibernate must
      # never be allowed to auto-generate or alter the schema.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 100
        order_inserts: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

# --- Security -------------------------------------------------
# JWT_SECRET must be provided via environment/config in any real deployment.
# It is intentionally NOT defaulted here (only the dev profile provides a
# clearly-marked insecure default) so that a real environment fails fast
# instead of silently running with a guessable signing key.
security:
  jwt:
    secret: ${JWT_SECRET}
    # Access-token lifetime in milliseconds. Kept short-lived by default;
    # this project does not implement refresh tokens (spec section 12.7).
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    issuer: ${JWT_ISSUER:ielop-platform}
  cors:
    # Comma-separated list of allowed origins for browser requests.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Log Observer ---------------------------------------------
app:
  elasticsearch:
    url: ${ES_URL:http://localhost:9200}
    index: ${ES_INDEX_PATTERN:logs-flow-*}
    username: ${ES_USERNAME:backend_reader}
    password: ${ES_PASSWORD:}
    # Resource caps (spec section 8.10).
    timeout: 10s
    max-page-size: 1000
    total-hits-cap: 10000
    seed-cap: 5000
  flows:
    # Flow definitions and their JSON schema (section 2.6). A relative path that does not exist is
    # also tried one level up, so the backend finds ../config/flows when run from backend/.
    dir: ${FLOW_DEFINITIONS_DIR:config/flows}
  # Trace assembly (section 7.1); every value is part of the trace configuration hash.
  trace:
    window-pad-ms: 2000
    thread-window-ms: 500
    time-only-window-ms: 300
    min-confidence: 0.3
    noise-threads: "^(scheduling|quartz|cache-refresh)-.*"
  graph:
    max-nodes-per-stage: 12
  ids:
    # Observed user IDs accepted in paths (section 8.7).
    user-pattern: "^[A-Za-z0-9._@-]{1,64}$"
  activity:
    # Event actions shown as failed sign-ins and permission denials in the user activity view (section 7.3).
    failed-sign-in-actions: LOGIN_FAILED,MFA_FAILED
    permission-denied-actions: AUTHZ_DENIED
  # Anomaly rules (section 10). R02 is disabled by owner decision (docs/DECISIONS.md).
  rules:
    disabled: R02
    business-timezone: ${LOG_TIMEZONE:UTC}
    off-hours-start: 0
    off-hours-end: 5
    stuck-after-minutes: 240
    failed-login-threshold: 5
    failed-login-window-minutes: 10
    slow-stage-floor-ms: 15000
    slow-stage-baseline-days: 7
    slow-stage-min-samples: 30
    duplicate-window-seconds: 60
    authz-denied-threshold: 5
    authz-distinct-resources: 3
    authz-window-minutes: 10
    scanner-request-threshold: 100
    scanner-window-minutes: 5
    scanner-rejected-share: 0.6
    scanner-user-agents: sqlmap,nikto,masscan,nmap,zgrab,python-requests
    scan-lookback-hours: 24
    scan-interval-minutes: 5
    schedule-enabled: true
    failed-login-actions: LOGIN_FAILED,MFA_FAILED
    authz-denied-actions: AUTHZ_DENIED
    scanner-rejected-statuses: 401,403,404
    evidence-sample: 50
  log-timezone: ${LOG_TIMEZONE:UTC}
  # Rate limits (section 8.10) and retention (section 9.2).
  rate-limits:
    login-per-minute: 10
    assistant-messages-per-minute: 20
    summary-requests-per-hour: 30
  retention:
    dismissed-anomaly-days: 365
    ai-days: 90
    cron: "0 30 3 * * *"
  # AI (sections 8.3 and 11). Without AI_API_KEY the openai provider reports DISABLED; AI_PROVIDER=fake runs offline.
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:openai}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    max-context-tokens: ${AI_MAX_CONTEXT_TOKENS:12000}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1500}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    # Ordered fallbacks (OpenAI-compatible), used when the provider before is busy or failing; empty key = skipped.
    fallback1:
      base-url: ${AI_FALLBACK1_BASE_URL:}
      api-key: ${AI_FALLBACK1_API_KEY:}
      model: ${AI_FALLBACK1_MODEL:}
      max-context-tokens: ${AI_FALLBACK1_MAX_CONTEXT_TOKENS:5000}
    fallback2:
      base-url: ${AI_FALLBACK2_BASE_URL:}
      api-key: ${AI_FALLBACK2_API_KEY:}
      model: ${AI_FALLBACK2_MODEL:}
      max-context-tokens: ${AI_FALLBACK2_MAX_CONTEXT_TOKENS:12000}
    max-tool-calls-per-turn: 5
    daily-token-budget-per-user: 200000
    internal-cidrs: 10.0.0.0/8

# OpenAPI docs are off by default; the dev profile serves them at /api/docs (spec section 8.7).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        # Keep this minimal and non-sensitive at the Foundation stage.
        include: health,info
  endpoint:
    health:
      # Components (db, elasticsearch, ai) and details only for ADMINISTRATOR (section 8.8).
      show-details: when_authorized
      show-components: when_authorized
      roles: ADMINISTRATOR
      # An AI that is switched off is DISABLED, not DOWN, and does not change the overall status.
      status:
        order: DOWN,OUT_OF_SERVICE,UP,DISABLED,UNKNOWN
        http-mapping:
          DISABLED: 200

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{requestId}]){cyan} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    root: INFO
    com.ielop.platform: INFO
    org.flywaydb: INFO
