# Test profile. The datasource comes from the shared Testcontainers Postgres
# (pgvector/pgvector:pg16, see support/IntegrationTest), so Flyway owns the
# schema exactly as in dev and prod and Hibernate only validates it.
spring:
  # Many test classes need their own Spring context (different properties), and each keeps a pool open
  # against the one shared Postgres container: keep the pools small.
  datasource:
    hikari:
      maximum-pool-size: 6
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: never
  # Most tests run without Elasticsearch; ElasticsearchIntegrationTest turns this back on.
  health:
    elasticsearch:
      enabled: false

# Fixed, non-sensitive signing secret used only for the test profile. Never
# reused for dev/prod (see application-dev.yml / application.yml).
security:
  jwt:
    secret: test-only-jwt-signing-secret-fixed-value-not-used-anywhere-else-0123456789
    expiration-ms: 3600000
    issuer: ielop-platform-test
  cors:
    allowed-origins: http://localhost:5173

# Tests drive the rule scan worker directly (RuleScanService); no background scheduling.
app:
  rules:
    schedule-enabled: false
  ai:
    # Tests never call a real provider; the ones that need the OpenAI-compatible path stub it with WireMock.
    provider: fake
    worker-enabled: false
  scheduling:
    enabled: false
  # Many tests sign in and call the AI from the same address and users; RateLimitTest sets real limits.
  rate-limits:
    login-per-minute: 100000
    assistant-messages-per-minute: 100000
    summary-requests-per-hour: 100000
